# This is a basic workflow to help you get started with Actions
name: publish-doc

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on: [push]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
            tinytex: true

      - name: Install Apt Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y maven netcdf-bin libnetcdf-dev openjdk-17-jdk python3 pip wget

      - name: Install Python Packages
        run: |
            pip install xarray cartopy jupyter scipy matplotlib pandas netcdf4 numpy jupyter-cache

      - name: Compile Java code
        run:  |
            mvn build-helper:remove-project-artifact
            mvn -B package -DskipTests=true

      - name: Cache Input Files
        id: cache-input
        uses: actions/cache@v3
        env:
            cache-name: cache-input-files
        with:
            path: input
            key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('input/*.nc') }}
            restore-keys: |
                ${{ runner.os }}-build-${{ env.cache-name }}-
                ${{ runner.os }}-build-
                ${{ runner.os }}-

      - name: Download input files
        if: steps.cache-input.outputs.cache-hit != 'true'
        run: wget https://zenodo.org/records/10890690/files/input.zip && unzip input.zip

      - name: Render Quarto Project
        run: |
            cd doc && quarto render --to html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
            path: doc/_book

    # Deployment job
  deploy:
      environment:
        name: github-pages
        url: ${{steps.deployment.outputs.page_url}}
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4