image: ghcr.io/quarto-dev/quarto:1.9.27

build-pages:
  cache:
    paths:
      - .cache/pip
      - .venv
      - input
      - doc/ichthyop_output
  pages:
    publish: doc/public
  script:
  - apt update -y
  - apt install -y python3 openjdk-11-jdk python3 pip python-is-python3 maven libgeos-dev
  - pip install cartopy matplotlib numpy nbformat jupyter-cache netcdf4 jupytext ipykernel xarray pandas dask scipy
  - wget https://zenodo.org/records/10890690/files/input.zip && unzip -o input.zip
  - python -m ipykernel install --user --name python3 --display-name "Python 3"
  - quarto install chromium
  - quarto render doc --output-dir=public
  artifacts:
    paths:
    - public
